[project]
name = "tarea-2"
version = "0.1.0"
description = "Tarea 2: corpus de documentos y audio en español peruano (OCR + ASR)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "requests>=2.32",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
    "spacy>=3.8",
    "es-core-news-md",
]

[dependency-groups]
# OCR (Sesión 10): uv sync --group docai
docai = [
    "paddlepaddle==3.2.0",
    "paddleocr>=3.2",
    "opencv-python-headless>=4.10",
]
# ASR (Sesión 13): uv sync --group audio
audio = [
    "faster-whisper>=1.1",
    "torch>=2.5",
    "torchaudio>=2.5",
    "pyannote.audio>=3.3",
    "speechbrain>=1.0",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[tool.uv]
# Paddle corre en CPU y torch en CUDA, así que conviven en un solo entorno y el
# notebook usa un único kernel: uv sync --group docai --group audio
default-groups = ["docai", "audio"]

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
